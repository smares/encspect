name: Standard WMA cut and encoded variants through Microsoft's decoder

# Asks Microsoft's decoder for standard Windows Media Audio (versions 1 and 2) how many samples it outputs where the last frame
# of the stream ends in blocks of different sizes: scripts/fixtures/windows/make_wma_std_variants.py cuts committed standard
# files after chosen frames (the frame count in a superframe's header lowered, the later media objects removed, the counts of
# the headers fixed), and make_windows_wma_fixtures.ps1 -Set std encodes further files (the clicks signal, other rates and channel
# counts, as far as the Windows encoders offer them). The probe of windows-wma-decode.yml decodes every file with the Source Reader and
# the decoder DMO (see docs/development.md, "WMA decoding by Microsoft's decoder"); the variants are generated in the job and not
# committed. scripts/fixtures/windows/check_wma_std_variants.py compares the records with the rule under test and runs on Linux.
# Run by hand (Actions, Run workflow) or by pushing the branch ci/windows-wma-std. Not part of ci.yml and not a check.
on:
  workflow_dispatch:
  push:
    branches: [ci/windows-wma-std]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  decode:
    name: decode variants on windows-2025
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: 10.0.x

      - name: Build the probe and the analyzer
        shell: bash
        run: |
          dotnet publish scripts/fixtures/windows/WmaDecodeProbe -c Release -o probe-bin
          dotnet publish src/Encspect.Cli -c Release -o analyzer-bin

      - name: Encode further standard files with Microsoft's encoders
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fixtures/windows/make_windows_wma_fixtures.ps1 -Out wma-out -Set std

      - name: Write the variants
        shell: bash
        run: python scripts/fixtures/windows/make_wma_std_variants.py analyzer-bin/encspect.exe variants "tests/fixtures/asf:external-windows-wma92-cbr-stereo-44k-128.wma,external-windows-wma92-cbr-stereo-22k-32.wma,external-windows-wma92-cbr-stereo-48k-128.wma,external-windows-wma92-cbr-mono-44k-48.wma,external-windows-wma92-vbr-stereo-44k-q10.wma,external-windows-wma92-vbr-stereo-44k-q75.wma,external-windows-wma92-cbr-stereo-44k-32-sdk.wma,external-ffmpeg-wmav1-stereo-44k-128k.wma,external-ffmpeg-wmav2-stereo-44k-64k.wma,external-ffmpeg-wmav1-mono-22k-24k.wma,external-remux-ffmpeg-wma92-cbr-stereo-22k-32.wma" wma-out/wma

      - name: Decode every variant (three runs each)
        shell: bash
        timeout-minutes: 70
        run: |
          mkdir -p decode-out
          ./probe-bin/wma-decode-probe.exe --out decode-out --timeout 30 variants 2>&1 | tee decode-out/log.txt
          cp variants/manifest.json decode-out/manifest.json
          cp wma-out/encodes.json wma-out/environment.json wma-out/formats.txt decode-out/ || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-wma-std-variants
          path: decode-out
          retention-days: 7
          if-no-files-found: error
