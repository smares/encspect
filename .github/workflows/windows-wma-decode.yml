name: WMA decoding by Microsoft's decoder

# Decodes the project's ASF and WMA fixtures with the decoders of Windows on a windows-2025 runner,
# two ways (three runs per file, each in a process of its own), and uploads one JSON record per file with a record of the OS build and the decoder DLLs:
#   - Media Foundation's Source Reader with PCM output: every sample's timestamp, duration and frame
#     count, each ReadSample result and stream flags;
#   - the WMA, WMA Professional and Lossless or WMA Voice decoder DMO used directly, fed one media
#     object at a time from the probe's own minimal ASF reader, so that damaged files reach the decoder;
#     run a second time without timestamps on the input buffers, as a control;
#   - the Source Reader's samples of the fixtures of versions 1 and 2 as floats (decode-out/pcm), which crosscheck_wma_pcm.py --microsoft compares with the analyzer's, and the figures
#     (never the samples) of the three version 1 files of Microsoft's encoder (downloaded, not committed: scripts/fixtures/wma1_microsoft_samples.py), compared on the runner.
# scripts/fixtures/windows/compare_windows_wma_decode.py compares the records with the analyzer's
# reports and ffmpeg's sample counts (it runs on Linux). Run by hand (Actions, "WMA decoding by
# Microsoft's decoder", Run workflow, optionally with a list of more files) or by pushing the branch
# ci/windows-wma-decode. Nothing is released and no build is uploaded: only the records, for seven days.
# Not part of ci.yml and not a check: a difference between decoders is a finding, not a failure.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Optional: a text file in the repository with one more .wma or .asf path per line"
        required: false
        default: ""
  push:
    branches: [ci/windows-wma-decode]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  decode:
    name: decode on windows-2025
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: 10.0.x

      - name: Build the probe
        shell: bash
        run: dotnet publish scripts/fixtures/windows/WmaDecodeProbe -c Release -o probe-bin

      - name: Smoke test on one file
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p smoke-out
          ./probe-bin/wma-decode-probe.exe --out smoke-out --timeout 30 tests/fixtures/asf/external-ffmpeg-wmav2-stereo-44k-128k.wma
          head -c 3000 smoke-out/records/*.json

      - name: Decode every fixture (three runs each)
        shell: bash
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 45
        env:
          EXTRA_PATHS: ${{ github.event.inputs.paths }}
        run: |
          mkdir -p decode-out
          args=(--out decode-out --timeout 30)
          if [ -n "$EXTRA_PATHS" ]; then args+=(--list "$EXTRA_PATHS"); fi
          ./probe-bin/wma-decode-probe.exe "${args[@]}" tests/fixtures/asf 2>&1 | tee decode-out/log.txt

      # Microsoft's samples of the fixtures of versions 1 and 2, floats at full scale, for scripts/fixtures/crosscheck_wma_pcm.py --microsoft (the decoder is the reference of the
      # decoder of versions 1 and 2, docs/design/wma-standard-decoding.md).
      - name: Write the decoded samples of the version 1 and 2 fixtures
        if: always()
        shell: bash
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p decode-out/pcm
          ./probe-bin/wma-decode-probe.exe wma-pcm decode-out/pcm tests/fixtures/asf/external-ffmpeg-wmav*.wma tests/fixtures/asf/external-windows-wma92-[cv]*.wma tests/fixtures/asf/external-remux-ffmpeg-wma92-*.wma tests/fixtures/asf/derived-ffmpeg-wmav2-*.asf tests/fixtures/asf/sample-kit/external-wme9-*.wma 2>&1 | tee decode-out/pcm/log.txt

      - name: Install ffmpeg for the sample counts
        if: always()
        shell: powershell
        continue-on-error: true
        run: choco install ffmpeg --version=9.0.2 --no-progress -y

      # The ffmpeg column of comparison.txt comes from this version; the script run on Linux uses the local ffmpeg.
      - name: Record the ffmpeg version
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          ffmpeg -version | head -1 | tee decode-out/ffmpeg-version.txt
          python -c "import json,pathlib; p=pathlib.Path('decode-out/environment.json'); e=json.loads(p.read_text(encoding='utf-8')); e['ffmpeg']=pathlib.Path('decode-out/ffmpeg-version.txt').read_text().strip(); p.write_text(json.dumps(e, indent=2)+'\n', encoding='utf-8')"

      # Three version 1 files that Microsoft's encoder wrote (FFmpeg's sample archive, commercial content). They are downloaded at their SHA-256 into the runner's temporary folder and
      # decoded there: neither the files nor any samples derived from them are uploaded or committed. Only figures leave the runner: the probe's records (counts), the SHA-256 of
      # Microsoft's samples and the output of crosscheck_wma_pcm.py --samples (RMS and largest differences), in decode-out/wma1-microsoft/.
      - name: Compare the version 1 files of Microsoft's encoder (figures only)
        if: always()
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p decode-out/wma1-microsoft "$RUNNER_TEMP/wma1-samples" "$RUNNER_TEMP/wma1-pcm"
          python scripts/fixtures/wma1_microsoft_samples.py "$RUNNER_TEMP/wma1-samples" 2>&1 | tee decode-out/wma1-microsoft/download-log.txt
          for f in "$RUNNER_TEMP"/wma1-samples/*.asf; do ./probe-bin/wma-decode-probe.exe wma-pcm "$RUNNER_TEMP/wma1-pcm" "$f" 2>&1 | tee -a decode-out/wma1-microsoft/records.txt; done
          (cd "$RUNNER_TEMP/wma1-pcm" && sha256sum *.f32) | tee decode-out/wma1-microsoft/microsoft-pcm-sha256.txt
          dotnet build tests/Encspect.PcmDump -c Release -v q
          python scripts/fixtures/crosscheck_wma_pcm.py --samples "$RUNNER_TEMP/wma1-samples" --microsoft "$RUNNER_TEMP/wma1-pcm" --pcmdump "dotnet $(cygpath -m "$PWD")/tests/Encspect.PcmDump/bin/Release/net10.0/Encspect.PcmDump.dll" tests/fixtures/asf/external-ffmpeg-wmav1-stereo-44k-48k.wma 2>&1 | tee decode-out/wma1-microsoft/crosscheck.txt

      - name: Compare with the analyzer and ffmpeg
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          cat decode-out/environment.json
          python scripts/fixtures/windows/compare_windows_wma_decode.py decode-out --fixtures tests/fixtures/asf | tee decode-out/comparison.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-wma-decode-windows-2025
          path: decode-out
          retention-days: 7
          if-no-files-found: error
