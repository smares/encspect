name: WMA decoding by Microsoft's decoder

# Decodes the project's ASF and WMA fixtures with the decoders of Windows on a windows-2025 runner,
# two ways (three runs per file, each in a process of its own), and uploads one JSON record per file with a record of the OS build and the decoder DLLs:
#   - Media Foundation's Source Reader with PCM output: every sample's timestamp, duration and frame
#     count, each ReadSample result and stream flags;
#   - the WMA, WMA Professional and Lossless or WMA Voice decoder DMO used directly, fed one media
#     object at a time from the probe's own minimal ASF reader, so that damaged files reach the decoder;
#     run a second time without timestamps on the input buffers, as a control.
# scripts/fixtures/windows/compare_windows_wma_decode.py compares the records with the analyzer's
# reports and ffmpeg's sample counts (it runs on Linux). Run by hand (Actions, "WMA decoding by
# Microsoft's decoder", Run workflow, optionally with a list of more files) or by pushing the branch
# ci/windows-wma-decode. Nothing is released and no build is uploaded: only the records, for seven days.
# Not part of ci.yml and not a check: a difference between decoders is a finding, not a failure.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Optional: a text file in the repository with one more .wma or .asf path per line"
        required: false
        default: ""
  push:
    branches: [ci/windows-wma-decode]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  decode:
    name: decode on windows-2025
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the probe
        shell: bash
        run: dotnet publish scripts/fixtures/windows/WmaDecodeProbe -c Release -o probe-bin

      - name: Smoke test on one file
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p smoke-out
          ./probe-bin/wma-decode-probe.exe --out smoke-out --timeout 30 tests/fixtures/asf/external-ffmpeg-wmav2-stereo-44k-128k.wma
          head -c 3000 smoke-out/records/*.json

      - name: Decode every fixture (three runs each)
        shell: bash
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 45
        env:
          EXTRA_PATHS: ${{ github.event.inputs.paths }}
        run: |
          mkdir -p decode-out
          args=(--out decode-out --timeout 30)
          if [ -n "$EXTRA_PATHS" ]; then args+=(--list "$EXTRA_PATHS"); fi
          ./probe-bin/wma-decode-probe.exe "${args[@]}" tests/fixtures/asf 2>&1 | tee decode-out/log.txt

      - name: Install ffmpeg for the sample counts
        if: always()
        shell: powershell
        continue-on-error: true
        run: choco install ffmpeg --version=9.0.2 --no-progress -y

      # The ffmpeg column of comparison.txt comes from this version; the script run on Linux uses the local ffmpeg.
      - name: Record the ffmpeg version
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          ffmpeg -version | head -1 | tee decode-out/ffmpeg-version.txt
          python -c "import json,pathlib; p=pathlib.Path('decode-out/environment.json'); e=json.loads(p.read_text(encoding='utf-8')); e['ffmpeg']=pathlib.Path('decode-out/ffmpeg-version.txt').read_text().strip(); p.write_text(json.dumps(e, indent=2)+'\n', encoding='utf-8')"

      - name: Compare with the analyzer and ffmpeg
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          cat decode-out/environment.json
          python scripts/fixtures/windows/compare_windows_wma_decode.py decode-out --fixtures tests/fixtures/asf | tee decode-out/comparison.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-wma-decode-windows-2025
          path: decode-out
          retention-days: 7
          if-no-files-found: error
