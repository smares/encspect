name: CI

# Pull requests run what the change needs, on four platforms; a push to main, the nightly schedule and a
# manual run run everything, on six. The nightly run and a manual one also write every long input with all
# three writers on more threads, and fuzz for half an hour. Every Linux job is pinned: the cross-check jobs,
# whose tools' versions the golden reports name, to ubuntu-24.04, every other job to ubuntu-26.04. See "CI" in
# docs/development.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Every other run has a group of its own: runs of a
# group queue behind each other, and GitHub keeps only one pending run per group and cancels the older pending
# one, which would drop the result of a commit on main or of a night that scripts/ci_report.py reads.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Avalonia's build tasks send usage data unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The thread-safety tests write every long input with all three writers on more threads only here.
  ENCSPECT_FULL_THREAD_TESTS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
  # Where scripts/fixtures/downloads.py keeps the files it fetched (restored by the jobs that download).
  ENCSPECT_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/downloads

jobs:
  # Decides, from the files a pull request changes, which jobs it needs (scripts/ci/changes.py). Every
  # job's output is named like the job; the aggregate job accepts a skipped job only when its output is
  # false. Anything but a pull request, and anything the script cannot place, runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      reason: ${{ steps.decide.outputs.reason }}
      pipeline: ${{ steps.pipeline.outputs.changed }}
      build-matrix: ${{ steps.decide.outputs.build-matrix }}
      test-matrix: ${{ steps.decide.outputs.test-matrix }}
      build-test: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.build-test }}
      unit-tests: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.unit-tests }}
      shard-guard: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.shard-guard }}
      fuzz: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.fuzz }}
      format: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.format }}
      fixtures: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.fixtures }}
      mpeg-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.mpeg-crosscheck }}
      mp4-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.mp4-crosscheck }}
      ogg-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.ogg-crosscheck }}
      musepack-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.musepack-crosscheck }}
      wavpack-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.wavpack-crosscheck }}
      asf-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.asf-crosscheck }}
      ac3-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.ac3-crosscheck }}
      dts-crosscheck: ${{ steps.pipeline.outputs.changed == 'true' && 'true' || steps.decide.outputs.dts-crosscheck }}
    steps:
      # Two commits deep: on a pull request the checkout is the merge commit, and its first parent is the base.
      # Only the scripts are needed in the working tree; the diff reads names, not contents.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: scripts

      # Decided here, in plain shell and not by changes.py, so that a change to the filter cannot excuse itself: a
      # pull request that touches .github/ or scripts/ci/ runs every job and accepts no skip (see all-checks).
      # A diff that cannot be read counts as a change.
      - name: Look for changes to the pipeline itself
        id: pipeline
        run: |
          changed=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if ! files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD) || grep -qE '^(\.github/|scripts/ci/)' <<< "$files"; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Decide which jobs run
        id: decide
        run: python3 scripts/ci/changes.py

  # The light check a documentation change still gets, and the tests of the scripts the pipeline runs.
  docs:
    name: documentation and pipeline scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /docs/
            /scripts/
            /README.md
            /CLAUDE.md
          sparse-checkout-cone-mode: false

      - name: Check the links and the indexes of the documentation
        run: python3 scripts/ci/check_docs.py

      - name: Test the change filter and the verdict
        run: |
          python3 scripts/ci/test_changes.py
          python3 scripts/ci/test_check_results.py

  build-test:
    name: build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build-test == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The packages of this job are 1.5 GB unpacked (the SkiaSharp native assets of every platform), so they are
      # restored on every run and saved by none but the runs of main, once per platform and package set (the last
      # step). Pull requests add no entry; docs/development.md has the numbers.
      - name: Restore the NuGet packages
        id: nuget
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The GUI tests; Encspect.Tests runs in the unit-tests job, in shards.
      - name: Test the GUI
        id: gui-tests
        run: dotnet test tests/Encspect.Gui.Tests --no-build --configuration Release --logger "trx;LogFileName=gui.trx" --results-directory "${{ runner.temp }}/trx"

      - name: Summarize the failed GUI tests
        if: failure() && steps.gui-tests.outcome == 'failure'
        shell: bash
        run: bash scripts/ci/python.sh scripts/ci/summarize.py tests "${{ runner.temp }}/trx" --title "GUI tests on ${{ matrix.os }}" || true

      - name: Keep the failed GUI test results
        if: failure() && steps.gui-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-gui-${{ matrix.os }}
          path: ${{ runner.temp }}/trx
          retention-days: 30
          if-no-files-found: ignore

      - name: CLI smoke test
        shell: bash
        run: |
          printf 'not audio' > "$RUNNER_TEMP/sample.bin"
          dotnet run --no-build --configuration Release --project src/Encspect.Cli -- --json "$RUNNER_TEMP/sample.bin" | tee "$RUNNER_TEMP/out.json"
          grep -q 'format.unrecognized' "$RUNNER_TEMP/out.json"
          grep -q '"schemaVersion": 1' "$RUNNER_TEMP/out.json"
          dotnet run --no-build --configuration Release --project src/Encspect.Cli -- --ndjson "$RUNNER_TEMP/sample.bin" "$RUNNER_TEMP/sample.bin" | tee "$RUNNER_TEMP/out.ndjson"
          test "$(grep -c 'format.unrecognized' "$RUNNER_TEMP/out.ndjson")" = 2
          test "$(wc -l < "$RUNNER_TEMP/out.ndjson")" -eq 2

      # Built on the runner of its own platform, so the smoke run below executes the real binary. Not
      # uploaded: the repository is public, and no build is published before development ends.
      - name: Publish the self-contained CLI
        run: dotnet publish src/Encspect.Cli --configuration Release --runtime ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true --output publish/${{ matrix.rid }}

      - name: Run the published CLI
        shell: bash
        run: |
          publish/${{ matrix.rid }}/encspect --csv tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/out.csv"
          grep -q 'LAME 3.100' "$RUNNER_TEMP/out.csv"

      # Not uploaded either. A runner has no display to open a window on, so the published GUI runs
      # its self-check: it loads Skia's and HarfBuzz's native libraries and the platform backend's
      # (ANGLE on Windows, Avalonia.Native on macOS) from the single file and analyzes a fixture
      # through the host, without showing a window.
      - name: Publish the self-contained GUI
        run: dotnet publish src/Encspect.Gui --configuration Release --runtime ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true --output publish/gui-${{ matrix.rid }}

      - name: Run the published GUI's self-check
        shell: bash
        run: |
          publish/gui-${{ matrix.rid }}/encspect-gui --self-check tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/gui.txt"
          grep -q 'Skia and HarfBuzz loaded' "$RUNNER_TEMP/gui.txt"
          grep -q 'Platform backend' "$RUNNER_TEMP/gui.txt"
          grep -q 'LAME 3.100' "$RUNNER_TEMP/gui.txt"

      # Linux has two windowing backends, both managed code over the system's libraries: X11, the
      # default (also under Wayland, through XWayland), and Wayland, which ENCSPECT_GUI_BACKEND=wayland
      # opts in to. Weston's headless backend with the pixman renderer is a compositor without a GPU
      # or display; the self-check starts the backend without showing a window and names it, and
      # the step fails if it is not the one asked for. These greps also guard the screen-handle
      # descriptors ("WaylandOutput", "XRandRMonitorName") that the GUI tells the backends apart by.
      # Wayland's start-up blocks synchronously, hence the timeouts.
      - name: Run the published GUI's self-check on Wayland and X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y weston xvfb
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=encspect-wl --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do test -S "$XDG_RUNTIME_DIR/encspect-wl" && break; sleep 0.2; done
          test -S "$XDG_RUNTIME_DIR/encspect-wl" || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          gui=publish/gui-${{ matrix.rid }}/encspect-gui
          fixture=tests/fixtures/mpeg/external-lame-tagged.mp3

          # Wayland is opt-in.
          env -u DISPLAY WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=wayland timeout 120 $gui --self-check $fixture | tee "$RUNNER_TEMP/wayland.txt"
          grep -q 'Windowing backend: Wayland\.' "$RUNNER_TEMP/wayland.txt"

          # A session with both a compositor and an X server uses X11 unless Wayland is asked for.
          env WAYLAND_DISPLAY=encspect-wl timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/both.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/both.txt"

          env WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=wayland timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/both-wayland.txt"
          grep -q 'Windowing backend: Wayland\.' "$RUNNER_TEMP/both-wayland.txt"

          env WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=x11 timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/forced-x11.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/forced-x11.txt"

          env -u WAYLAND_DISPLAY timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/x11.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/x11.txt"

          # A compositor alone does not start Wayland: the self-check reports that X11 has no display, with exit 0.
          env -u DISPLAY WAYLAND_DISPLAY=encspect-wl timeout 120 $gui --self-check $fixture | tee "$RUNNER_TEMP/wayland-only.txt"
          grep -q 'Windowing backend: not started, X11 is chosen' "$RUNNER_TEMP/wayland-only.txt"
          if grep -q 'Windowing backend: Wayland' "$RUNNER_TEMP/wayland-only.txt"; then exit 1; fi

          # An unknown value warns and chooses automatically.
          env ENCSPECT_GUI_BACKEND=bogus timeout 120 xvfb-run -a $gui --self-check $fixture > "$RUNNER_TEMP/bogus.err" 2>&1
          grep -q 'ENCSPECT_GUI_BACKEND=bogus is not recognized; use x11 or wayland' "$RUNNER_TEMP/bogus.err"

          # A forced backend without its display ends with one line and exit code 1, not an abort.
          status=0
          env -u DISPLAY -u WAYLAND_DISPLAY ENCSPECT_GUI_BACKEND=wayland timeout 120 $gui 2> "$RUNNER_TEMP/no-wayland.err" || status=$?
          test "$status" = 1
          grep -q 'ENCSPECT_GUI_BACKEND' "$RUNNER_TEMP/no-wayland.err"
          status=0
          env -u WAYLAND_DISPLAY DISPLAY=:99 ENCSPECT_GUI_BACKEND=x11 timeout 120 $gui 2> "$RUNNER_TEMP/no-x11.err" || status=$?
          test "$status" = 1
          grep -q 'ENCSPECT_GUI_BACKEND' "$RUNNER_TEMP/no-x11.err"

  # Encspect.Tests in shards (scripts/ci/shards.json), each on every platform of the event, so a platform's
  # tests take as long as its slowest shard. check_shards.py proves in shard-guard that the shards together
  # run every test exactly once.

      - name: Save the NuGet packages
        if: github.event_name != 'pull_request' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}

  unit-tests:
    name: unit tests (${{ matrix.os }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.unit-tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Encspect.Tests

      - name: Build
        run: dotnet build tests/Encspect.Tests --no-restore --configuration Release

      - name: Test the ${{ matrix.shard }} shard
        id: tests
        shell: bash
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: dotnet test tests/Encspect.Tests --no-build --configuration Release --filter "$SHARD_FILTER" --logger "trx;LogFileName=${{ matrix.shard }}.trx" --results-directory "${{ runner.temp }}/trx"

      - name: Summarize the failed tests
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: bash scripts/ci/python.sh scripts/ci/summarize.py tests "${{ runner.temp }}/trx" --title "Unit tests, ${{ matrix.shard }} shard, ${{ matrix.os }}" || true

      - name: Keep the failed test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/trx
          retention-days: 30
          if-no-files-found: ignore

  shard-guard:
    name: the shards run every test once
    needs: changes
    if: needs.changes.outputs.shard-guard == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the tests
        run: dotnet build tests/Encspect.Tests --configuration Release

      # Lists the tests of each shard's filter and of none, and fails unless the shards partition them.
      - name: Check the shards
        run: python3 scripts/ci/check_shards.py

  fuzz:
    name: fuzz smoke test
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # A new seed every run; the log prints it, and a failure saves the input as an artifact. Five minutes on
      # a pull request and on main, half an hour in the nightly run.
      - name: Analyze mutated fixtures for ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'half an hour' || 'five minutes' }}
        env:
          CI_SUMMARY_FILES: fuzz-failures
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 1800 || 300 }}
        run: dotnet run --configuration Release --project tests/Encspect.Fuzz -- --seconds "$FUZZ_SECONDS" --seed $(( (RANDOM << 15) | RANDOM )) --out fuzz-failures

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: fuzz-failures
          retention-days: 30

  format:
    name: formatting
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify whitespace formatting
        run: dotnet format whitespace --folder --verify-no-changes

  fixtures:
    name: fixtures are reproducible
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate the hand-built tag fixtures
        run: python3 scripts/fixtures/make_tag_fixtures.py

      - name: Regenerate the hand-built MPEG fixtures
        run: python3 scripts/fixtures/make_mpeg_fixtures.py

      - name: Regenerate the hand-built Layer III fixtures
        run: python3 scripts/fixtures/make_layer3_fixtures.py

      - name: Regenerate the hand-built Layer II fixtures
        run: python3 scripts/fixtures/make_layer2_fixtures.py

      - name: Regenerate the hand-built VBR header fixtures
        run: python3 scripts/fixtures/make_vbr_fixtures.py

      - name: Regenerate the hand-built statistics fixtures
        run: python3 scripts/fixtures/make_stats_fixtures.py

      - name: Regenerate the hand-built MP4 and raw AAC fixtures
        run: python3 scripts/fixtures/make_mp4_fixtures.py

      # The parser's and the model's Huffman and band tables agree and are complete prefix codes.
      - name: Check the AAC tables
        run: python3 scripts/fixtures/check_aac_tables.py

      - name: Regenerate the hand-built Ogg fixtures and the encoder-made ones' manifests
        run: |
          python3 scripts/fixtures/make_ogg_fixtures.py
          python3 scripts/fixtures/make_external_ogg_fixtures.py --manifests-only
          python3 scripts/fixtures/make_vorbis_opus_fixtures.py
          python3 scripts/fixtures/make_external_vorbis_opus_fixtures.py --manifests-only

      - name: Regenerate the hand-built Musepack fixtures and the encoder-made ones' manifests
        run: |
          python3 scripts/fixtures/make_musepack_fixtures.py
          python3 scripts/fixtures/make_external_musepack_fixtures.py --manifests-only

      - name: Regenerate the hand-built WavPack fixtures and the encoder-made ones' manifests
        run: |
          python3 scripts/fixtures/make_wavpack_fixtures.py
          python3 scripts/fixtures/make_external_wavpack_fixtures.py --manifests-only

      - name: Regenerate the hand-built AC-3 fixtures and the encoder-made ones' manifests
        run: |
          python3 scripts/fixtures/make_ac3_fixtures.py
          python3 scripts/fixtures/make_external_ac3_fixtures.py --manifests-only

      - name: Regenerate the hand-built DTS fixtures and the encoder-made ones' manifests
        run: |
          python3 scripts/fixtures/make_dts_fixtures.py
          python3 scripts/fixtures/make_external_dts_fixtures.py --manifests-only

      - name: Regenerate the hand-built ASF fixtures and the encoder-made WMA ones' manifests
        run: |
          python3 scripts/fixtures/make_asf_fixtures.py
          python3 scripts/fixtures/make_external_asf_fixtures.py --manifests-only

      - name: Fail if they differ from the committed files
        run: |
          git status --porcelain -- tests/fixtures
          test -z "$(git status --porcelain -- tests/fixtures)"

  mpeg-crosscheck:
    name: MPEG fixtures and the analyzer agree with ffprobe, libmad, mpg123, minimp3, mctoolamed, mp3guessenc, MediaInfo, the ISO streams and mp3PRO samples
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mpeg-crosscheck == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - name: Name the week
        id: week
        run: echo "name=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Pinned downloads (source archives, samples) a public address served are kept between runs. The cache is
      # addressed by the files' SHA-256 and every entry is checked against its pin before use
      # (scripts/fixtures/downloads.py), so a changed pin downloads the new file; nothing here can hide one.
      # Files only the private repository served are never put in it: the public Actions cache can be restored by
      # a pull request from a fork. The key changes with the ISO week and with the manifests, so a job saves one
      # entry a week, not one per commit; restore-keys finds the last week's.
      - name: Cache the pinned downloads
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: downloads-${{ github.job }}-${{ steps.week.outputs.name }}-${{ hashFiles('tests/conformance/*.json') }}
          restore-keys: downloads-${{ github.job }}-

      # Each week's entry restores the last one and saves it again; downloads.py touches a file when it uses or
      # stores it, so what no job has used for a month (a pin that changed) leaves the cache here.
      - name: Drop downloads nobody has used for a month
        run: find .cache/downloads -type f -mtime +30 -delete 2>/dev/null || true

      # minimp3, mp3guessenc and EncSpot are built from third_party with the runner's C and C++ compilers.
      - name: Install ffmpeg, madplay and mpg123
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg madplay mpg123 php-cli mediainfo

      - name: Cross-check the MPEG fixtures
        run: python3 scripts/fixtures/crosscheck_mpeg_fixtures.py

      # ISO's license does not allow redistributing the conformance streams, so they are fetched and checked
      # against their SHA-256 rather than committed. The download cache keeps the ones a public address served.
      # The private repository's copy is the last address tried, with a read-only token.
      - name: Check the conformance manifest against the ISO streams
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}
        run: python3 scripts/fixtures/conformance_mpeg_audio.py .cache/conformance

      # The mp3PRO samples are commercial music, so they are fetched and checked against their SHA-256
      # rather than committed. The download cache keeps the ones a public address served.
      - name: Check the mp3PRO manifest against the samples
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}
        run: python3 scripts/fixtures/check_mp3pro_samples.py .cache/mp3pro

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the CLI
        run: dotnet build --configuration Release src/Encspect.Cli

      - name: Check the analyzer against the conformance manifest
        run: python3 scripts/fixtures/conformance_mpeg_audio.py --analyzer src/Encspect.Cli/bin/Release/net10.0/encspect .cache/conformance

      - name: Check the analyzer against the mp3PRO manifest
        run: python3 scripts/fixtures/check_mp3pro_samples.py --analyzer src/Encspect.Cli/bin/Release/net10.0/encspect .cache/mp3pro

  mp4-crosscheck:
    name: MP4 and AAC fixtures agree with ffprobe, MP4Box, faad and MediaInfo, and other encoders' xHE-AAC and HE-AAC samples with the manifests
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mp4-crosscheck == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash scripts/ci/step-shell.sh {0}
    steps:
      - uses: actions/checkout@v5

      - name: Name the week
        id: week
        run: echo "name=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Pinned downloads (source archives, samples) a public address served are kept between runs. The cache is
      # addressed by the files' SHA-256 and every entry is checked against its pin before use
      # (scripts/fixtures/downloads.py), so a changed pin downloads the new file; nothing here can hide one.
      # Files only the private repository served are never put in it: the public Actions cache can be restored by
      # a pull request from a fork. The key changes with the ISO week and with the manifests, so a job saves one
      # entry a week, not one per commit; restore-keys finds the last week's.
      - name: Cache the pinned downloads
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: downloads-${{ github.job }}-${{ steps.week.outputs.name }}-${{ hashFiles('tests/conformance/*.json') }}
          restore-keys: downloads-${{ github.job }}-

      # Each week's entry restores the last one and saves it again; downloads.py touches a file when it uses or
      # stores it, so what no job has used for a month (a pin that changed) leaves the cache here.
      - name: Drop downloads nobody has used for a month
        run: find .cache/downloads -type f -mtime +30 -delete 2>/dev/null || true

      - name: Name the runner image
        id: image
        run: echo "name=$ImageOS" >> "$GITHUB_OUTPUT"

      # The faad2 build with the trace patches. Its key holds faad_trace_tool.py, which holds the pinned
      # commit and the patches, and the runner image, whose compiler built it.
      - name: Cache the traced faad2 build
        uses: actions/cache@v6
        with:
          path: .cache/tools/faad2-trace
          key: faad2-trace-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ hashFiles('scripts/fixtures/faad_trace_tool.py') }}

      # ffmpeg 6.1, GPAC 2.2 and faad2 2.11 from Ubuntu 24.04, the versions the manifests were checked with.
      - name: Install ffmpeg, gpac and faad
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gpac faad mediainfo

      - name: Cross-check the MP4 and AAC fixtures
        run: python3 scripts/fixtures/crosscheck_mp4_fixtures.py

      # Fraunhofer's, the ISO conformance streams' and one more exhale file, which the exhale layout
      # rule is checked against; fetched and checked against their SHA-256 rather than committed.
      - name: Check the xHE-AAC manifest against the samples
        run: python3 scripts/fixtures/check_usac_samples.py .cache/usac
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}

      # The SBR conformance and aacPlus decoder check streams, which the FAAC 2.x layout rule is checked
      # against; fetched from FFmpeg's FATE suite (or the private repository's copies), checked against their
      # SHA-256.
      - name: Check the HE-AAC manifest against the samples
        run: python3 scripts/fixtures/check_sbr_samples.py .cache/sbr
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the CLI
        run: dotnet build --configuration Release src/Encspect.Cli

      - name: Check the analyzer against the xHE-AAC manifest
        run: python3 scripts/fixtures/check_usac_samples.py --analyzer src/Encspect.Cli/bin/Release/net10.0/encspect .cache/usac
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}

      - name: Check the analyzer against the HE-AAC manifest
        run: python3 scripts/fixtures/check_sbr_samples.py --analyzer src/Encspect.Cli/bin/Release/net10.0/encspect .cache/sbr
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}

