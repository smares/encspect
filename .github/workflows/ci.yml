name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: CLI smoke test
        shell: bash
        run: |
          printf 'not audio' > "$RUNNER_TEMP/sample.bin"
          dotnet run --no-build --configuration Release --project src/Encspect.Cli -- --json "$RUNNER_TEMP/sample.bin" | tee "$RUNNER_TEMP/out.json"
          grep -q 'format.unrecognized' "$RUNNER_TEMP/out.json"

  format:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify whitespace formatting
        run: dotnet format whitespace --folder --verify-no-changes
