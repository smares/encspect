        run: python3 scripts/fixtures/crosscheck_dts_fixtures.py

      # Real DTS-HD Master Audio files (a 7.1 stream of two channel sets, a 96 kHz 5.0 stream, a 16-bit stereo stream) from the FFmpeg sample
      # archive, which allows downloading and states no license for redistribution, so they are fetched and checked against their SHA-256
      # rather than committed. The download cache keeps them; every address is public. No real DTS:X or .dtshd file could be found.
      - name: Check the real DTS-HD Master Audio samples with ffprobe and MediaInfo
        run: python3 scripts/fixtures/check_dts_hd_samples.py .cache/dts-hd

      - name: Check the analyzer against the real DTS-HD Master Audio samples
        run: python3 scripts/fixtures/check_dts_hd_samples.py --analyzer src/Encspect.Cli/bin/Release/net10.0/encspect .cache/dts-hd

  # The one check the ruleset requires, so it never lists job names. Every other job must be in needs
  # (CiWorkflowTests enforces it). always() keeps it running when a needed job fails or is canceled. Only
  # success passes, and a job may be skipped only when the changes job decided it is not needed
  # (scripts/ci/check_results.py): a skip any other way, such as behind a failed dependency, fails.
  # A matrix job reports one result for all its legs, which is not success if any leg failed.
  all-checks:
    name: all checks passed
    if: always()
    needs:
      - changes
      - docs
      - build-test
      - unit-tests
      - shard-guard
      - fuzz
      - format
      - fixtures
      - mpeg-crosscheck
      - mp4-crosscheck
      - ogg-crosscheck
      - musepack-crosscheck
      - wavpack-crosscheck
      - asf-crosscheck
      - ac3-crosscheck
      - dts-crosscheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci

      # Apart from the script, which a pull request may change: no skip passes when the pipeline changed.
      - name: A change to the pipeline accepts no skipped job
        env:
          NEEDS: ${{ toJSON(needs) }}
          PIPELINE: ${{ needs.changes.outputs.pipeline }}
        run: |
          if [ "$PIPELINE" != false ] && echo "$NEEDS" | jq -e 'any(.[]; .result == "skipped")' > /dev/null; then
            echo "::error::The pipeline changed, or the changes job did not say, and a job was skipped."
            exit 1
          fi

      # Always runs, so the log shows each job's result and the real cause (a canceled changes job, say) even when the step above failed.
      - name: Require every job to succeed or to be skipped on purpose
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py
