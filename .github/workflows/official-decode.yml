name: Cross-checks by the formats' official decoders

# The probe of docs/design/official-decoder-crosschecks.md (rollout step 1): an inventory of the audio decoders of each runner image
# and a few files per open question, decoded by FDK AAC, libopus and libvorbis (through a harness that feeds them packet by packet and
# through opusdec and oggdec), tta, Core Audio and Media Foundation. Each job uploads JSON records, never media. Run by hand
# (Actions, "Cross-checks by the formats' official decoders", Run workflow) or by pushing the branch ci/official-decode.
# Not part of ci.yml and not a check: a difference between decoders is a finding, not a failure.
on:
  workflow_dispatch:
  push:
    branches: [ci/official-decode]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: FDK AAC, libopus, libvorbis and tta on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install the decoders' packages and the compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg opus-tools vorbis-tools libogg-dev libopus-dev libvorbis-dev build-essential cmake git

      # The three FDK AAC versions of open question 6, each built from the commit of its tag. The harness is compiled
      # against each version's own headers.
      - name: Build FDK AAC 2.0.2, 2.0.3 and 3.0.0 and the harnesses
        run: |
          set -euo pipefail
          mkdir -p build/bin build/inc out
          : > out/build-info.txt
          for entry in v2.0.2=801f67f671929311e0c9952c5f92d6e147c7b003 v2.0.3=716f4394641d53f0d79c9ddac3fa93b03a49f278 v3.0.0=a68a51aa45d86a43c7b228e3d45624af09dcdd8d; do
            name=${entry%%=*}; commit=${entry##*=}
            git clone -q https://github.com/mstorsjo/fdk-aac "build/fdk-$name"
            git -C "build/fdk-$name" checkout -q "$commit"
            test "$(git -C build/fdk-$name rev-parse HEAD)" = "$commit"
            cmake -S "build/fdk-$name" -B "build/fdk-$name/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_PROGRAMS=OFF > /dev/null
            cmake --build "build/fdk-$name/build" -j4 > /dev/null
            mkdir -p "build/inc/$name/fdk-aac"
            cp -n build/fdk-$name/libAACdec/include/*.h build/fdk-$name/libSYS/include/*.h build/fdk-$name/libAACenc/include/*.h "build/inc/$name/fdk-aac/" 2>/dev/null || true
            gcc -O2 -w -I"build/inc/$name" scripts/fixtures/fdk_decode.c -L"build/fdk-$name/build" -lfdk-aac -o "build/bin/fdk_decode-$name"
            echo "fdk-aac $name $commit $(ls build/fdk-$name/build/libfdk-aac.so.*.*.* | head -1)" >> out/build-info.txt
          done
          gcc -O2 -Wall scripts/fixtures/ogg_decode.c -o build/bin/ogg_decode -lvorbis -lopus -logg
          dpkg-query -W -f='${Package} ${Version}\n' libogg-dev libopus-dev libvorbis-dev libogg0 libopus0 libvorbis0a ffmpeg opus-tools vorbis-tools >> out/build-info.txt
          cat out/build-info.txt

      - name: Build libtta-c 2.3 for tta
        run: |
          set -euo pipefail
          cd scripts/fixtures
          python3 -c "import libtta_tool; print(libtta_tool.build('${{ github.workspace }}/build/libtta'))" | tail -1 | tee ../../build/tta-path.txt

      - name: Run the probe
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 40
        run: |
          python3 -I scripts/fixtures/official_probe.py linux --out out --bin build/bin \
            --fdk v2.0.2=$PWD/build/fdk-v2.0.2/build v2.0.3=$PWD/build/fdk-v2.0.3/build v3.0.0=$PWD/build/fdk-v3.0.0/build \
            --tta "$(cat build/tta-path.txt)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-linux
          path: out
          retention-days: 30
          if-no-files-found: error
