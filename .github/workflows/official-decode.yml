name: Cross-checks by the formats' official decoders

# The cross-checks of docs/design/official-decoder-crosschecks.md. Each decoder job decodes the fixtures (and, on Linux, the derived damage variants of
# derive_variants.py) with the format owner's decoder through a child process of its own per file and path, and uploads JSON records, never media.
# The comparison job (Linux, ffmpeg 8.0.1) sets the records against the analyzer's figures and ffmpeg and uploads comparison.txt, comparison.json and
# the draft of tests/fixtures/<format>/official-decoders.json. Run by hand (Actions, "Cross-checks by the formats' official decoders", Run workflow)
# or by pushing a branch named ci/official-decode or ci/official-decode-*. Not part of ci.yml and not a check: a difference between decoders is
# a finding, not a failure.
#
#   linux     libopus and libvorbis through ogg_decode.c and through oggdec and opusdec, over every Opus and Vorbis fixture and its variants (rollout step 2)
#   compare   the comparison of the records of every decoder job
#   probe-*   the probe of rollout step 1 (FDK AAC, tta, Core Audio, Media Foundation): Run workflow with probe set
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Also run the probe jobs of rollout step 1 (FDK AAC, tta, Core Audio, Media Foundation)
        type: boolean
        default: false
  push:
    branches:
      - ci/official-decode
      - ci/official-decode-*

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: libopus and libvorbis on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the decoders' packages and the compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y opus-tools vorbis-tools libogg-dev libopus-dev libvorbis-dev build-essential

      # A different version is a warning, not a failure: the records name what ran, and a moved image is one of the reasons to run this again.
      - name: Check the tool versions
        run: |
          mkdir -p out
          python3 -I -c "
          import sys
          sys.path.insert(0, 'scripts/fixtures')
          import tool_versions
          found = tool_versions.problems('oggdec', 'opus-tools', 'libogg', 'libopus', 'libvorbis', 'libopusfile', 'libvorbisfile')
          open('out/version-warnings.txt', 'w').write('\n'.join(found) + ('\n' if found else ''))
          for line in found:
              print('::warning::' + line)
          print('versions checked, %d differ' % len(found))"
          dpkg-query -W -f='${Package} ${Version}\n' libogg0 libopus0 libopusfile0 libvorbis0a libvorbisfile3 libogg-dev libopus-dev libvorbis-dev opus-tools vorbis-tools

      - name: Build the Ogg harness
        run: |
          mkdir -p build/bin
          gcc --version | head -1
          gcc -O2 -Wall scripts/fixtures/ogg_decode.c -o build/bin/ogg_decode -lvorbis -lopus -logg

      - name: Decode the Opus and Vorbis files and their variants
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 40
        run: python3 -I scripts/fixtures/official_decode.py ogg --out out --bin build/bin

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-linux
          path: out
          retention-days: 30
          if-no-files-found: error

  compare:
    name: Comparison with the analyzer and ffmpeg on ubuntu-26.04
    runs-on: ubuntu-26.04
    needs: [linux]
    if: always()
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v8
        with:
          pattern: official-decode-*
          path: artifacts

      # The analyzer's figures of the derived variants come from the command line program; the committed fixtures use their golden reports.
      - name: Build the command line program
        run: dotnet publish src/Encspect.Cli -c Release -o cli-out

      - name: Compare
        run: |
          python3 -I -c "
          import sys
          sys.path.insert(0, 'scripts/fixtures')
          import tool_versions
          found = tool_versions.problems('ffmpeg', 'ffprobe')
          for line in found:
              print('::warning::' + line)"
          find artifacts -maxdepth 2 | sort | head -30
          python3 -I scripts/fixtures/compare_official_decoders.py --encspect cli-out/encspect --run-id "$GITHUB_RUN_ID" --out comparison \
            --write-official comparison/official-decoders.ogg.draft.json --previous tests/fixtures/ogg/official-decoders.json artifacts
          { echo '```'; awk '/^Differences/{f=1} f' comparison/comparison.txt | head -c 500000; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-comparison
          path: comparison
          retention-days: 30
          if-no-files-found: error

  probe-linux:
    name: Probe, FDK AAC, libopus, libvorbis and tta on ubuntu-26.04
    if: ${{ inputs.probe }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # One Python for the unit extractor on every platform, so that the lists are made by the same interpreter (the design's harness rules).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the decoders' packages and the compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg opus-tools vorbis-tools libogg-dev libopus-dev libvorbis-dev build-essential cmake git

      # The versions the probe's figures were taken with (run 41304419984 on image ubuntu26 20261026.180.1). A different version is a warning, not
      # a failure: the probe records what it ran with, and a moved image is one of the reasons to run it again.
      - name: Check the package versions
        run: |
          mkdir -p out
          while read -r package version; do
            found=$(dpkg-query -W -f='${Version}' "$package")
            if [ "$found" != "$version" ]; then echo "::warning::$package is $found, the probe was written with $version"; echo "version differs: $package $found (expected $version)" >> out/version-warnings.txt; fi
          done <<'LIST'
          ffmpeg 7:8.0.1-3ubuntu2
          libogg0 1.3.6-2
          libopus0 1.6.1-1
          libvorbis0a 1.3.7-3build2
          opus-tools 0.2-1build5
          vorbis-tools 1.4.3-1build1
          LIST

      - name: Cache the FDK AAC builds
        id: fdk-cache
        uses: actions/cache@v6
        with:
          path: |
            build/inst-v2.0.2
            build/inst-v2.0.3
            build/inst-v3.0.0
          key: fdk-aac-801f67f-716f439-a68a51a-${{ runner.os }}-ubuntu26-gcc15

      # The three FDK AAC versions of open question 6, each built from the commit of its tag. The harness is compiled
      # against each version's own headers.
      - name: Build FDK AAC 2.0.2, 2.0.3 and 3.0.0 and the harnesses
        run: |
          set -euo pipefail
          mkdir -p build/bin out
          : > out/build-info.txt
          gcc --version | head -1 >> out/build-info.txt
          for entry in v2.0.2=801f67f671929311e0c9952c5f92d6e147c7b003 v2.0.3=716f4394641d53f0d79c9ddac3fa93b03a49f278 v3.0.0=a68a51aa45d86a43c7b228e3d45624af09dcdd8d; do
            name=${entry%%=*}; commit=${entry##*=}
            if [ ! -d "build/inst-$name/lib" ]; then
              git clone -q https://github.com/mstorsjo/fdk-aac "build/fdk-$name"
              git -C "build/fdk-$name" checkout -q "$commit"
              test "$(git -C build/fdk-$name rev-parse HEAD)" = "$commit"
              cmake -S "build/fdk-$name" -B "build/fdk-$name/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_PROGRAMS=OFF > /dev/null
              cmake --build "build/fdk-$name/build" -j4 > /dev/null
              cmake --install "build/fdk-$name/build" --prefix "$PWD/build/inst-$name" > /dev/null
            fi
            gcc -O2 -w -I"build/inst-$name/include" scripts/fixtures/fdk_decode.c -L"build/inst-$name/lib" -lfdk-aac -o "build/bin/fdk_decode-$name"
            echo "fdk-aac $name $commit $(ls build/inst-$name/lib | tr '\n' ' ')" >> out/build-info.txt
          done
          gcc -O2 -Wall scripts/fixtures/ogg_decode.c -o build/bin/ogg_decode -lvorbis -lopus -logg
          dpkg-query -W -f='${Package} ${Version}\n' libogg-dev libopus-dev libvorbis-dev libogg0 libopus0 libvorbis0a ffmpeg opus-tools vorbis-tools >> out/build-info.txt
          cat out/build-info.txt

      # libtta_tool.build() hides the compiler's output and gcc 15 (Ubuntu 26.04) refuses something in the 2.3 sources by default, so the
      # archive is fetched and checked by the repository's script and compiled here as C17. Nothing is patched. The compiler's output goes to a
      # file that is not uploaded and not printed: its diagnostics quote lines of libtta's LGPL source, which the TTA decoder's agents must not read
      # (decisions 6 and 10 of decoders.md).
      - name: Build libtta-c 2.3 for tta
        run: |
          set -euo pipefail
          mkdir -p build/libtta
          (cd scripts/fixtures && python3 -c "
          import libtta_tool, pathlib, tarfile
          target = pathlib.Path('${{ github.workspace }}/build/libtta')
          libtta_tool.downloads.fetch(libtta_tool.ADDRESSES, libtta_tool.SHA256, target / libtta_tool.NAME)
          tarfile.open(target / libtta_tool.NAME).extractall(target, filter='data')")
          cd build/libtta/libtta-c-2.3
          gcc --version | head -1
          if ! { CC='gcc -std=gnu17' ./configure && make; } > ../../tta-build.log 2>&1; then echo "libtta-c did not build; the log is build/tta-build.log on the runner and is not printed"; exit 1; fi
          ./console/tta -h 2>&1 | head -3 || true
          echo "$PWD/console/tta" > ../../tta-path.txt
          echo "libtta-c 2.3 $(sha256sum ../libtta-c-2.3.tar.gz | cut -d' ' -f1)" >> ../../../out/build-info.txt

      - name: Run the probe
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 40
        run: |
          python3 -I scripts/fixtures/official_probe.py linux --out out --bin build/bin \
            --fdk v2.0.2=$PWD/build/inst-v2.0.2/lib v2.0.3=$PWD/build/inst-v2.0.3/lib v3.0.0=$PWD/build/inst-v3.0.0/lib \
            --tta "$(cat build/tta-path.txt)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-probe-linux
          path: out
          retention-days: 30
          if-no-files-found: error

  probe-macos:
    name: Probe, Core Audio on ${{ matrix.runner }}
    if: ${{ inputs.probe }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      # One Python for the unit extractor on every platform, so that the lists are made by the same interpreter (the design's harness rules).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the AudioToolbox probe
        run: |
          mkdir -p build
          clang -O2 -Wall scripts/fixtures/macos/audiotoolbox_probe.c -framework AudioToolbox -framework CoreFoundation -o build/audiotoolbox_probe

      - name: Run the probe
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 40
        run: python3 -I scripts/fixtures/official_probe.py macos --out out --probe build/audiotoolbox_probe

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-probe-macos-${{ matrix.runner }}
          path: out
          retention-days: 30
          if-no-files-found: error

  probe-windows:
    name: Probe, Media Foundation on ${{ matrix.runner }}
    if: ${{ inputs.probe }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            full: true
          - runner: windows-2022
            full: false
          - runner: windows-11-arm
            full: false
    steps:
      - uses: actions/checkout@v5

      # One Python for the unit extractor on every platform, so that the lists are made by the same interpreter (the design's harness rules).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the probe
        shell: bash
        run: dotnet publish scripts/fixtures/windows/WmaDecodeProbe -c Release -o probe-bin

      - name: Inventory of the audio decoders
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p inventory-out
          ./probe-bin/wma-decode-probe.exe inventory --out inventory-out --timeout 60 | head -c 20000

      - name: Make the unit lists
        if: matrix.full
        shell: bash
        run: |
          mkdir -p units inventory-out
          python --version | tee inventory-out/python-version.txt
          python -I scripts/fixtures/unit_list.py --tsv-dir units tests/fixtures/aac tests/fixtures/adts tests/fixtures/apple tests/fixtures/mp4 tests/fixtures/ac3
          ls units | wc -l

      - name: Decode with the Source Reader and the AAC decoder MFT
        if: matrix.full
        shell: bash
        # The artifact is uploaded even if this step runs out of time (environment.json is written first).
        timeout-minutes: 40
        run: |
          mkdir -p decode-out
          for folder in aac adts apple mp4 ac3; do
            mkdir -p "decode-out/$folder"
            ./probe-bin/wma-decode-probe.exe --format aac --units units --out "decode-out/$folder" --timeout 30 "tests/fixtures/$folder" 2>&1 | tee -a decode-out/log.txt | tail -3
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-decode-probe-windows-${{ matrix.runner }}
          path: |
            inventory-out
            decode-out
          retention-days: 30
          if-no-files-found: ignore
