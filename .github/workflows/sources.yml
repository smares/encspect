name: sources

# Every file the fixture scripts download, from its original address and from each copy, so a
# source that disappears is noticed while a copy still serves it. Weekly, and on changes to the
# lists of addresses.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fixtures/downloads.py
      - scripts/fixtures/check_sources.py
      - scripts/fixtures/conformance_mpeg_audio.py
      - scripts/fixtures/check_mp3pro_samples.py
      - scripts/fixtures/check_usac_samples.py
      - scripts/fixtures/mctoolamed_tool.py
      - scripts/fixtures/fhg_tool.py
      - scripts/fixtures/xing_tool.py
      - scripts/fixtures/blade_tool.py
      - scripts/fixtures/helix_tool.py
      - scripts/fixtures/gogo_tool.py
      - scripts/fixtures/old_lame_tool.py
      - scripts/fixtures/lame_win_tool.py
      - scripts/fixtures/wavpack_tool.py
      - scripts/fixtures/ffmpeg_sources.py
      - scripts/fixtures/dts_specs.py
      - scripts/fixtures/libdca_source.py
      - tests/conformance/**
      - .github/workflows/sources.yml

permissions:
  contents: read

jobs:
  sources:
    name: every download address serves its pinned file
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download every file from every address
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}
        run: python3 scripts/fixtures/check_sources.py
