name: sources

# Every file the fixture scripts download, from its original address and from each copy, so a
# source that disappears is noticed while a copy still serves it. Weekly, and on changes to the
# lists of addresses. A pull request checks only the entries it adds or changes (those of
# `check_sources.py --list` on its merge commit that the base commit lacks, plus all of a kind when it
# changes the module that checks that kind), so a host that is down for an address nobody touched does
# not fail it; it checks everything when it changes downloads.py, check_sources.py, sources_plan.py or
# this file. The weekly and manual runs check everything. A change to any script of the fixtures starts
# the job, which downloads nothing when no entry is affected.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fixtures/**
      - tests/conformance/**
      - scripts/ci/sources_plan.py
      - scripts/ci/test_sources_plan.py
      - .github/workflows/sources.yml

permissions:
  contents: read

jobs:
  sources:
    name: every download address serves its pinned file
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Choose the addresses to check
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Full check: $EVENT run."
            exit 0
          fi
          # The merge commit's first parent is the base; a worktree of it gives the base's own list.
          BASE_SHA="$(git rev-parse HEAD^1)"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git diff --no-renames --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          # Decided before any list: a base without --list cannot be diffed, and the change that adds it changes check_sources.py.
          reason="$(python3 scripts/ci/sources_plan.py --files "$RUNNER_TEMP/changed.txt")"
          if [ -n "$reason" ]; then
            echo "$reason"
            exit 0
          fi
          python3 scripts/fixtures/check_sources.py --list > "$RUNNER_TEMP/head.json"
          python3 "$RUNNER_TEMP/base/scripts/fixtures/check_sources.py" --list > "$RUNNER_TEMP/base.json"
          python3 scripts/ci/sources_plan.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/only.json"
          echo "only=$RUNNER_TEMP/only.json" >> "$GITHUB_OUTPUT"
          if [ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/only.json")" = 0 ]; then
            echo "Nothing to check: the pull request adds and changes no address."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download every file from every address
        if: steps.plan.outputs.empty != 'true'
        env:
          ENCSPECT_PRIVATE_TOKEN: ${{ secrets.ENCSPECT_PRIVATE_TOKEN }}
          ONLY: ${{ steps.plan.outputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python3 scripts/fixtures/check_sources.py --only "$ONLY"
          else
            python3 scripts/fixtures/check_sources.py
          fi
