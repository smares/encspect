name: Release

# A pushed version tag (vX.Y.Z) builds the NativeAOT CLI (on x64 also built for x86-64-v3, as a second archive) and the self-contained GUI for the six targets of CI's full matrix, each on
# a runner of its own platform, runs the same self-checks CI runs on them, packages them and publishes a GitHub release
# with the notes of docs/releases/<version>.md. The tag must equal v plus the Version in Directory.Build.props and be
# on main. A manual run (from main only) takes the tag as input, or derives v plus the Version when the input is empty:
# an existing tag repeats a release (an existing release gets its files replaced); a missing one is created by the
# release job at the head of main the run started from, after every build has passed. A pull request that changes the
# release files runs the checks and the six builds on its merge commit, with no upload and no release, so the steps that
# exist only here run before a tag does. CI itself uploads no build. See "Releases" in docs/development.md.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - scripts/release/**
      - THIRD-PARTY-NOTICES.md
      - Directory.Build.props
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0; leave empty to release the version on main (v plus the Version in Directory.Build.props). If the tag does not exist, the release job creates it at the head of main once every build has passed.
        required: false
        default: ""
        type: string

# Read-only everywhere but in the job that creates the release.
permissions:
  contents: read

# Every run that can publish (a tag push or a manual run) shares one group and queues behind the others, whatever tag
# it names, so that two runs never publish at once and none is canceled halfway through publishing; a new push to a
# pull request replaces its running checks. The release job still re-checks that a missing tag is missing, because a
# queued run's check-tag looked before the run ahead of it published.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Avalonia's build tasks send usage data unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The tag itself is decided in check-tag and passed on as its output; github.ref_name is read here only for a tag
  # push, where it names what to check out. What check-tag checks out: the tag of a tag push, else the commit of the
  # run (the merge commit of a pull request, the head of main for a manual run, which then moves to the tag if it
  # exists). The other jobs build the commit it verified.
  SOURCE_REF: ${{ github.event_name == 'push' && format('refs/tags/{0}', github.ref_name) || github.sha }}

jobs:
  # Fails unless the tag names the version the sources carry and the tagged commit is on main, so a release is never
  # built from a branch or under another number. On a pull request there is no tag: only the version and the notes are
  # checked. A manual run is accepted only from main, so that the workflow file of another branch cannot publish; started
  # from anything else it fails, with the reason, in the first step. A manual run whose tag does not exist yet is checked
  # against the commit of the run and reports create_tag=true; this job only reads, the release job creates the tag.
  check-tag:
    name: check the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      create_tag: ${{ steps.check.outputs.create_tag }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Require a manual run to start from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::A manual release run must be started from main (this one is on $REF), so that only the workflow file of main can publish."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      # The tag is the pushed one, the input of a manual run, or, for a manual run with an empty input, v plus the Version
      # at the commit of the run. Every later job reads it from this job's output.
      - name: Check the tag against Directory.Build.props and main
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          read_version() {
            sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' Directory.Build.props
          }
          tag="$PUSHED_TAG"
          create_tag=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              tag="v$(read_version)"
            fi
            # An existing tag is checked as a tag push is; a missing one is checked at the commit of this run.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
            if [ "$status" = 0 ]; then
              git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
              git checkout --detach "refs/tags/$tag^{commit}"
            elif [ "$status" = 2 ]; then
              create_tag=true
            else
              echo "::error::Could not look for the tag $tag on origin (git ls-remote exited with $status)."
              exit 1
            fi
          fi
          version=$(read_version)
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
            echo "::error::Directory.Build.props has no Version of the form X.Y.Z (found '$version')."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ "$tag" != "v$version" ]; then
              echo "::error::The tag is $tag, but Directory.Build.props has Version $version, so the tag must be v$version."
              exit 1
            fi
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::The commit $(git rev-parse --short HEAD) of $tag is not on main."
              exit 1
            fi
          fi
          if [ ! -f "docs/releases/$version.md" ]; then
            echo "::error::docs/releases/$version.md, the release notes, is missing."
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "create_tag=$create_tag"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  # The same targets as CI's full matrix (scripts/ci/changes.py), each built, run and packaged on its own platform.
  build:
    name: build (${{ matrix.rid }})
    needs: check-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-26.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      # The commit check-tag verified, not the tag again: a tag moved since then cannot change what is built.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && env.SOURCE_REF || needs.check-tag.outputs.sha }}

      # Pinned to one SDK, unlike CI's 10.0.x: a self-contained publish bundles the runtime of the SDK it runs on, and
      # THIRD-PARTY-NOTICES.md names that runtime. Change the pin, scripts/release/dotnet-pin.txt and the notices together.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      # No cache is restored in a release: what is compiled into it is downloaded fresh (NuGet from nuget.org, the sysroot by its
      # digest below), so nothing a cache entry holds can reach a release. CI caches both.
      - name: Restore
        run: dotnet restore

      # The release is built from the tagged sources on the runner of its own platform, so the runs below execute the real binaries.
      # The CLI is a NativeAOT executable, which cannot be cross-compiled between operating systems, hence a runner per platform.
      - name: Install the NativeAOT toolchain
        if: runner.os == 'Linux'
        # The one apt-get update of the job: the Wayland self-check below installs its packages from the same lists.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # NativeAOT links the C library it is given; linked on the runner's glibc the CLI would need that glibc or newer. The Linux
      # builds link against the sysroot of .NET's own cross-build image instead (Ubuntu 18.04, glibc 2.27, the floor of the runtime
      # pack the GUI carries). Only the layer of that image that holds the sysroot is fetched, by its content digest, which names
      # those bytes for good and is checked after the download (the image's tags are rebuilt and old ones pruned); the digests and
      # how to renew them are in docs/development.md, "NativeAOT". CI caches the layer by its digest; the release downloads it.
      - name: Fetch the glibc 2.27 sysroot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            linux-x64) dir=x64; digest=e47eeec6fa3711530ee4a6a7e7388dc338e99a5f3649770cc86a4f5ead96c0e2 ;;
            linux-arm64) dir=arm64; digest=b572d3dd8b297da80060077fbec8cd6d5062c219722ed466793128a640ac5e3b ;;
          esac
          layer="$RUNNER_TEMP/sysroot-layer/$digest.tar.gz"
          mkdir -p "$RUNNER_TEMP/sysroot-layer"
          download() {
            curl --fail --silent --show-error --location --retry 3 --output "$layer" \
              "https://mcr.microsoft.com/v2/dotnet-buildtools/prereqs/blobs/sha256:$digest"
          }
          if [ ! -f "$layer" ]; then download; fi
          # A cached file that does not match is downloaded once more before the check can fail the job.
          if ! echo "$digest  $layer" | sha256sum --check --status -; then
            echo "The layer does not match its digest; downloading it again." >&2
            rm -f "$layer"
            download
          fi
          echo "$digest  $layer" | sha256sum --check -
          # The sysroot's symbolic links are absolute, so it must sit where the image keeps it.
          sudo tar --extract --gzip --file "$layer" --directory / "crossrootfs/$dir"
          echo "ENCSPECT_SYSROOT=/crossrootfs/$dir" >> "$GITHUB_ENV"

      - name: Publish the NativeAOT CLI
        run: dotnet publish src/Encspect.Cli --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true --output publish/${{ matrix.rid }}

      - name: Run the published CLI
        shell: bash
        run: |
          publish/${{ matrix.rid }}/encspect --csv tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/out.csv"
          grep -q 'LAME 3.100' "$RUNNER_TEMP/out.csv"
          publish/${{ matrix.rid }}/encspect --version | tee "$RUNNER_TEMP/version.txt"
          grep -qE "^encspect $VERSION(\+[0-9a-f]+)?\$" "$RUNNER_TEMP/version.txt"

      # What the CLI needs of the system: glibc 2.27 and the libraries glibc ships, nothing else (the version references and
      # the dynamic section, so a requirement no symbol shows counts too). docs/releases/package-readme.md names 2.27.
      - name: Check the glibc the CLI needs
        if: runner.os == 'Linux'
        run: bash scripts/ci/check_glibc_floor.sh publish/${{ matrix.rid }}/encspect

      # The same analysis as the JIT build gives, on the whole fixture corpus with decoding: the reports, their standard error and the
      # exit codes must be identical but for the tool version line. CI runs it with the newest 10.0 SDK and the release with the pinned
      # one that builds what ships; a run on a pull request that changes the code is the first.
      - name: Compare the NativeAOT CLI with the JIT build
        shell: bash
        run: bash scripts/check_aot.sh -p publish/${{ matrix.rid }}/encspect "$RUNNER_TEMP/aot-check"

      # The x64 platforms ship a second CLI for processors with AVX2 (Haswell, 2013, and later; AMD Excavator and Zen): the same code compiled
      # for x86-64-v3, which the default build (x86-64-v2: Intel Core since Nehalem (2008), AMD since Bulldozer (2011) and Jaguar (2013); not Phenom II, Athlon II, Bobcat or Atom before Silvermont) cannot use. It gets the same checks. On a pull
      # request only linux-x64 builds it, to keep the time down; main, the nightly run and the release build it on every x64 platform.
      - name: Publish the NativeAOT CLI for x86-64-v3
        if: endsWith(matrix.rid, '-x64') && (matrix.rid == 'linux-x64' || github.event_name != 'pull_request')
        run: dotnet publish src/Encspect.Cli --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true -p:IlcInstructionSet=x86-64-v3 --output publish/${{ matrix.rid }}-v3

      - name: Run the published x86-64-v3 CLI
        if: endsWith(matrix.rid, '-x64') && (matrix.rid == 'linux-x64' || github.event_name != 'pull_request')
        shell: bash
        run: |
          publish/${{ matrix.rid }}-v3/encspect --csv tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/out-v3.csv"
          grep -q 'LAME 3.100' "$RUNNER_TEMP/out-v3.csv"

      - name: Check the glibc the x86-64-v3 CLI needs
        if: runner.os == 'Linux' && endsWith(matrix.rid, '-x64') && (matrix.rid == 'linux-x64' || github.event_name != 'pull_request')
        run: bash scripts/ci/check_glibc_floor.sh publish/${{ matrix.rid }}-v3/encspect

      - name: Compare the x86-64-v3 CLI with the JIT build
        if: endsWith(matrix.rid, '-x64') && (matrix.rid == 'linux-x64' || github.event_name != 'pull_request')
        shell: bash
        run: bash scripts/check_aot.sh -p publish/${{ matrix.rid }}-v3/encspect "$RUNNER_TEMP/aot-check"

      # A runner has no display to open a window on, so the published GUI runs its self-check: it loads Skia's and
      # HarfBuzz's native libraries and the platform backend's (ANGLE on Windows, Avalonia.Native on macOS) from the
      # single file and analyzes a fixture through the host, without showing a window.
      - name: Publish the self-contained GUI
        run: dotnet publish src/Encspect.Gui --configuration Release --runtime ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true --output publish/gui-${{ matrix.rid }}

      - name: Run the published GUI's self-check
        shell: bash
        run: |
          publish/gui-${{ matrix.rid }}/encspect-gui --self-check tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/gui.txt"
          grep -q 'Skia and HarfBuzz loaded' "$RUNNER_TEMP/gui.txt"
          grep -q 'Platform backend' "$RUNNER_TEMP/gui.txt"
          grep -q 'LAME 3.100' "$RUNNER_TEMP/gui.txt"

      # Linux has two windowing backends, both managed code over the system's libraries: X11, the
      # default (also under Wayland, through XWayland), and Wayland, which ENCSPECT_GUI_BACKEND=wayland
      # opts in to. Weston's headless backend with the pixman renderer is a compositor without a GPU
      # or display; the self-check starts the backend without showing a window and names it, and
      # the step fails if it is not the one asked for. These greps also guard the screen-handle
      # descriptors ("WaylandOutput", "XRandRMonitorName") that the GUI tells the backends apart by.
      # Wayland's start-up blocks synchronously, hence the timeouts.
      - name: Run the published GUI's self-check on Wayland and X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y weston xvfb
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=encspect-wl --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do test -S "$XDG_RUNTIME_DIR/encspect-wl" && break; sleep 0.2; done
          test -S "$XDG_RUNTIME_DIR/encspect-wl" || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          gui=publish/gui-${{ matrix.rid }}/encspect-gui
          fixture=tests/fixtures/mpeg/external-lame-tagged.mp3

          # Wayland is opt-in.
          env -u DISPLAY WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=wayland timeout 120 $gui --self-check $fixture | tee "$RUNNER_TEMP/wayland.txt"
          grep -q 'Windowing backend: Wayland\.' "$RUNNER_TEMP/wayland.txt"

          # A session with both a compositor and an X server uses X11 unless Wayland is asked for.
          env WAYLAND_DISPLAY=encspect-wl timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/both.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/both.txt"

          env WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=wayland timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/both-wayland.txt"
          grep -q 'Windowing backend: Wayland\.' "$RUNNER_TEMP/both-wayland.txt"

          env WAYLAND_DISPLAY=encspect-wl ENCSPECT_GUI_BACKEND=x11 timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/forced-x11.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/forced-x11.txt"

          env -u WAYLAND_DISPLAY timeout 120 xvfb-run -a $gui --self-check $fixture | tee "$RUNNER_TEMP/x11.txt"
          grep -q 'Windowing backend: X11\.' "$RUNNER_TEMP/x11.txt"

          # A compositor alone does not start Wayland: the self-check reports that X11 has no display, with exit 0.
          env -u DISPLAY WAYLAND_DISPLAY=encspect-wl timeout 120 $gui --self-check $fixture | tee "$RUNNER_TEMP/wayland-only.txt"
          grep -q 'Windowing backend: not started, X11 is chosen' "$RUNNER_TEMP/wayland-only.txt"
          if grep -q 'Windowing backend: Wayland' "$RUNNER_TEMP/wayland-only.txt"; then exit 1; fi

          # An unknown value warns and chooses automatically.
          env ENCSPECT_GUI_BACKEND=bogus timeout 120 xvfb-run -a $gui --self-check $fixture > "$RUNNER_TEMP/bogus.err" 2>&1
          grep -q 'ENCSPECT_GUI_BACKEND=bogus is not recognized; use x11 or wayland' "$RUNNER_TEMP/bogus.err"

          # A forced backend without its display ends with one line and exit code 1, not an abort.
          status=0
          env -u DISPLAY -u WAYLAND_DISPLAY ENCSPECT_GUI_BACKEND=wayland timeout 120 $gui 2> "$RUNNER_TEMP/no-wayland.err" || status=$?
          test "$status" = 1
          grep -q 'ENCSPECT_GUI_BACKEND' "$RUNNER_TEMP/no-wayland.err"
          status=0
          env -u WAYLAND_DISPLAY DISPLAY=:99 ENCSPECT_GUI_BACKEND=x11 timeout 120 $gui 2> "$RUNNER_TEMP/no-x11.err" || status=$?
          test "$status" = 1
          grep -q 'ENCSPECT_GUI_BACKEND' "$RUNNER_TEMP/no-x11.err"

      # One folder per archive, so extracting does not scatter files: both programs, the license, the notices of the
      # libraries inside them and a short README. Only the executables are taken from the publish output, not the symbol
      # files. The x64 platforms have a second archive, named with the suffix -v3 (encspect-<version>-<rid>-v3), which holds
      # the CLI built for x86-64-v3 and the same GUI; NAMES lists the archives of this platform.
      - name: Collect the files of the archive
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          names=""
          for variant in "" "-v3"; do
            cli="publish/${{ matrix.rid }}$variant/encspect$ext"
            if [ -n "$variant" ] && [ ! -f "$cli" ]; then continue; fi
            name="encspect-$VERSION-${{ matrix.rid }}$variant"
            mkdir -p "dist/$name"
            cp "$cli" "publish/gui-${{ matrix.rid }}/encspect-gui$ext" LICENSE THIRD-PARTY-NOTICES.md "dist/$name/"
            cp docs/releases/package-readme.md "dist/$name/README.md"
            if [ "$RUNNER_OS" != Windows ]; then chmod +x "dist/$name/encspect" "dist/$name/encspect-gui"; fi
            ls -l "dist/$name"
            names="$names $name"
          done
          echo "NAMES=$names" >> "$GITHUB_ENV"

      # tar keeps the executable bit; COPYFILE_DISABLE keeps macOS's tar from adding ._ files for extended attributes.
      - name: Pack the archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COPYFILE_DISABLE: 1
        run: |
          for name in $NAMES; do
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            tar -tzvf "dist/$name.tar.gz"
          done

      - name: Pack the archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in $env:NAMES.Trim().Split(' ')) {
            Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
            Get-Item "dist/$name.zip"
          }

      # The archive is what users get, so the programs in it, extracted elsewhere, are the ones run.
      - name: Run the CLI and the GUI from the archive
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          for NAME in $NAMES; do
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "Expand-Archive -Path 'dist/$NAME.zip' -DestinationPath '$RUNNER_TEMP/unpacked'"
            else
              tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP/unpacked"
            fi
            unpacked="$RUNNER_TEMP/unpacked/$NAME"
            "$unpacked/encspect$ext" --version | tee "$RUNNER_TEMP/packed-version.txt"
            grep -qE "^encspect $VERSION(\+[0-9a-f]+)?\$" "$RUNNER_TEMP/packed-version.txt"
            # The GUI as well: a lost executable bit or signature would show here.
            "$unpacked/encspect-gui$ext" --self-check tests/fixtures/mpeg/external-lame-tagged.mp3 | tee "$RUNNER_TEMP/packed-gui.txt"
            grep -q 'Skia and HarfBuzz loaded' "$RUNNER_TEMP/packed-gui.txt"
            test -f "$unpacked/THIRD-PARTY-NOTICES.md"
            test -f "$unpacked/LICENSE"
          done

      # After packaging, so a stale notice does not hide the packaging steps. The notices name the runtime pack the publish
      # bundled and cover every package the GUI restored; scripts/release/make_notices.py regenerates the file (see
      # "Releases" in docs/development.md).
      - name: Check that THIRD-PARTY-NOTICES.md matches this build
        shell: bash
        env:
          PYTHONUTF8: 1
        run: |
          bash scripts/ci/python.sh scripts/release/make_notices.py --self-test
          bash scripts/ci/python.sh scripts/release/make_notices.py --check --runtime-deps "src/Encspect.Cli/bin/Release/net10.0/${{ matrix.rid }}/encspect.deps.json"

      # Not on a pull request: any retention makes the builds downloadable.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The only job that can write to the repository: it creates the release (or, on a rerun, replaces the files of the
  # existing one). When a manual run found no tag, it also creates the tag, in the same call as the release and at the
  # commit the checks verified, so the tag appears only after every build has passed. A tag created with GITHUB_TOKEN
  # starts no other workflow run, so this run does not repeat itself through the tag push trigger. The version 0.x of a
  # project in development is a pre-release.
  release:
    name: create the GitHub release
    if: github.event_name != 'pull_request'
    needs: [check-tag, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      SHA: ${{ needs.check-tag.outputs.sha }}
      TAG: ${{ needs.check-tag.outputs.tag }}
      CREATE_TAG: ${{ needs.check-tag.outputs.create_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-tag.outputs.sha }}
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: |
          cd dist
          archives=(encspect-"$VERSION"-*)
          test "${#archives[@]}" = 9
          sha256sum encspect-"$VERSION"-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create the release
        run: |
          title="Encspect $VERSION"
          notes="docs/releases/$VERSION.md"
          prerelease=--prerelease
          case "$VERSION" in 0.*) ;; *) prerelease=--prerelease=false ;; esac
          if [ "$CREATE_TAG" = true ]; then
            # A tag push may have won the race since check-tag looked; then this run must not release a second time.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
            if [ "$status" != 2 ]; then
              echo "::error::The tag $TAG exists on origin now (or could not be looked up: git ls-remote exited with $status). Start a new run, or use Re-run all jobs (not Re-run failed jobs, which reuses the old check-tag result)."
              exit 1
            fi
            gh release create "$TAG" dist/* --target "$SHA" --title "$title" --notes-file "$notes" $prerelease
          elif gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --draft=false $prerelease
          else
            gh release create "$TAG" dist/* --verify-tag --title "$title" --notes-file "$notes" $prerelease
          fi
